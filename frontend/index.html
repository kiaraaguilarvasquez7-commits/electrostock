<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <!-- Permite tildes -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Responsive -->

  <title>ElectroStock — Login</title>

  <link rel="stylesheet" href="https://bootswatch.com/5/lux/bootstrap.min.css">

  <style>
    body {
      /* 🎨 Nuevo fondo moderno (morado-azul elegante) */
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .login-card {
      border-radius: 18px;
      border: none;
    }

    .login-header {
      /* 🎨 Header con degradado suave */
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 18px 18px 0 0;
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-primary {
      /* 🎨 Botón más moderno */
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="row justify-content-center">

      <div class="col-md-4">

        <div class="card shadow-lg login-card">

          <!-- Encabezado -->
          <div class="card-header login-header text-white text-center py-3">
            <h4 class="mb-0">⚡ ElectroStock</h4>
            <small>Iniciar Sesión</small>
          </div>

          <!-- Formulario -->
          <div class="card-body p-4">

            <!-- Mensaje error -->
            <div id="error-msg" class="alert alert-danger d-none"></div>

            <!-- Email -->
            <div class="mb-3">
              <label>Email</label>
              <input type="email" id="email" class="form-control" placeholder="ejemplo@email.com">
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label>Contraseña</label>
              <input type="password" id="password" class="form-control" placeholder="********">
            </div>

            <!-- Botón login -->
            <button class="btn btn-primary w-100" onclick="login()">
              Iniciar Sesión
            </button>

            <!-- Registro -->
            <div class="text-center mt-3">
              <small>
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate</a>
              </small>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

</body>

</html>
